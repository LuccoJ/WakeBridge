<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WakeBridge stable layout C, status at the bottom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:Roboto,system-ui,sans-serif;color:#191C1D}
a{color:#1F7A91}a:hover{color:#005466}
.rb{position:relative;width:150px;height:150px;border:0;border-radius:75px;background:transparent;color:#1F7A91;font:500 15px Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.rb .glow{position:absolute;inset:0;border-radius:75px;pointer-events:none}
.rb-idle .glow{background:radial-gradient(circle,rgba(158,221,238,0) 46%,rgba(158,221,238,.95) 52%,rgba(158,221,238,.45) 62%,rgba(158,221,238,0) 72%)}
.rb-run .glow{background:radial-gradient(circle,rgba(158,221,238,0) var(--fade),rgba(31,122,145,.9) 52%,rgba(31,122,145,0) 55%);animation:breathe 2.8s ease-in-out infinite}
.rb-off{color:#8A9599;cursor:default}
.rb-off .glow{background:radial-gradient(circle,rgba(185,194,197,0) 46%,rgba(185,194,197,.9) 52%,rgba(185,194,197,.4) 62%,rgba(185,194,197,0) 72%)}
@property --fade{syntax:'<percentage>';inherits:false;initial-value:40%}
@keyframes breathe{0%,100%{--fade:42%}50%{--fade:18%}}
.rb span,.rb svg{position:relative}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FBFC; display: flex; flex-direction: column">
  <header style="flex: none; padding: 16px 16px 8px 20px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">{{title}}</h1>
    <button onClick="{{toggleConnected}}" aria-label="{{chipLabel}}" style="display: flex; align-items: center; gap: 4px; padding: 6px 12px 6px 8px; border: 0; border-radius: 16px; background: {{chipBg}}; color: {{chipFg}}; font: 500 13px Roboto, sans-serif">
      <sc-if value="{{connected}}" hint-placeholder-val="{{ true }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>
      </sc-if>
      <sc-if value="{{disconnected}}" hint-placeholder-val="{{ false }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5-2 2"></path><path d="M3 3l18 18"></path></svg>
      </sc-if>
      Amazfit Bip
    </button>
  </header>
  <div style="flex: 1; min-height: 0; display: flex; gap: 10px; padding: 4px 20px 8px 10px">
      <aside aria-label="Day and night timeline, noon to noon" style="flex: none; width: 34px; position: relative">
        <div style="position: absolute; top: 4px; bottom: 4px; left: 3px; width: 28px">
          <div style="position: absolute; inset: 0; border-radius: 14px; background: {{tlGradient}}"></div>
          <div style="position: absolute; top: {{previewTop}}; height: {{previewHeight}}; left: 4px; right: 4px; border-radius: 3px; background: {{previewColor}}"></div>
          <div aria-hidden="true" style="position: absolute; top: 7px; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 11px; background: radial-gradient(circle, rgba(240, 200, 130, 0.75) 0%, rgba(240, 200, 130, 0.35) 45%, rgba(240, 200, 130, 0) 72%); filter: blur(1px)"></div>
          <div aria-hidden="true" style="position: absolute; top: calc(100% - 7px); left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 11px; background: radial-gradient(circle, rgba(240, 200, 130, 0.75) 0%, rgba(240, 200, 130, 0.35) 45%, rgba(240, 200, 130, 0) 72%); filter: blur(1px)"></div>
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="position: absolute; top: 50%; left: 50%; margin: -11px 0 0 -11px; opacity: 0.55; filter: blur(0.8px)"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#B7C8E8"></path></svg>
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="9">
            <span style="position: absolute; top: {{h.top}}; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; font-weight: 400; color: {{h.color}}">{{h.label}}</span>
          </sc-for>
          <div style="position: absolute; top: calc(8.7% - 1px); left: -3px; right: -3px; height: 2px; background: #1F7A91"></div>
          <div style="position: absolute; top: calc(8.7% - 4px); right: -6px; width: 8px; height: 8px; border-radius: 4px; background: #1F7A91"></div>
          <div style="position: absolute; top: calc(44.8% - 6px); left: -3px; right: -3px; height: 12px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; border: 2px solid #1F7A91"></div>
          <div style="position: absolute; top: calc(83.3% - 6px); left: -3px; right: -3px; height: 12px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; border: 2px solid #1F7A91"></div>
        </div>
      </aside>
      <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div role="group" aria-label="Mode" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #70787B; border-radius: 20px; overflow: hidden">
          <button onClick="{{setOnce}}" style="height: 40px; border: 0; background: {{onceBg}}; color: #191C1D; font: 500 14px Roboto, sans-serif">{{onceLabel}}</button>
          <button onClick="{{setEvery}}" style="height: 40px; border: 0; border-left: 1px solid #70787B; background: {{everyBg}}; color: #191C1D; font: 500 14px Roboto, sans-serif">{{everyLabel}}</button>
        </div>
        <p style="flex: none; margin: -6px 4px 0; height: 16px; font-size: 12px; color: #40484B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{modeCaption}}</p>

        <div style="flex: none; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 15px">Sleep amount</span>
            <span style="font-size: 20px; font-weight: 500; color: #1F7A91">{{amount}}</span>
          </div>
          <div style="position: relative; height: 30px" aria-label="Sleep amount">
            <div style="position: absolute; top: 13px; left: 0; right: 0; height: 4px; border-radius: 2px; background: #CDEFF8"></div>
            <div style="position: absolute; top: 11px; left: 0; width: {{amountPct}}; height: 8px; border-radius: 4px; background: #1F7A91"></div>
            <div style="position: absolute; top: 3px; left: {{amountPct}}; width: 4px; height: 24px; border-radius: 2px; background: #1F7A91"></div>
          </div>
        </div>

        <div style="flex: 1; min-height: 8px"></div>
        <div style="flex: none; height: 160px; display: flex; align-items: center; justify-content: center">
          <button class="{{rbClass}}" onClick="{{press}}" aria-label="{{rbLabel}}">
            <span class="glow"></span>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
            <span>{{rbLabel}}</span>
          </button>
        </div>
        <div style="flex: 1; min-height: 8px"></div>
        <fieldset style="flex: none; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
          <legend style="padding: 0; margin-bottom: 2px; font-size: 15px">Wake me</legend>
          <label style="height: 38px; display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="radio" name="wake" checked style="width: 18px; height: 18px; accent-color: #1F7A91"> {{wake1}}</label>
          <label style="height: 38px; display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="radio" name="wake" style="width: 18px; height: 18px; accent-color: #1F7A91"> {{wake2}}</label>
          <label style="height: 38px; display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="radio" name="wake" style="width: 18px; height: 18px; accent-color: #1F7A91"> {{wake3}}</label>
        </fieldset>

        <div style="flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 15px">{{extraLabel}}</span>
          <sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
            <span role="switch" aria-checked="false" aria-label="Include today's naps" style="flex: none; width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid #70787B; background: #E1E8EB; position: relative; display: block">
              <span style="position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; border-radius: 8px; background: #70787B"></span>
            </span>
          </sc-if>
          <sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 15px; font-weight: 500; color: #1F7A91">30 min</span>
          </sc-if>
        </div>
        <section style="flex: none; height: 76px; box-sizing: border-box; background: {{cardBg}}; color: {{cardFg}}; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
          <p style="margin: 0; font-size: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{statusTitle}}</p>
          <p style="margin: 0; font-size: 13px; color: {{cardSoft}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{statusDetail}}</p>
        </section>
      </main>
  </div>
  <nav aria-label="Sections" style="flex: none; height: 80px; background: #E8F1F4; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <a href="#" onClick="{{showDay}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C1D; font-size: 12px; font-weight: {{dayWeight}}">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: {{dayPill}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </span>
      Day naps
    </a>
    <a href="#" onClick="{{showNight}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C1D; font-size: 12px; font-weight: {{nightWeight}}">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: {{nightPill}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </span>
      Night sleep
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #40484B; font-size: 12px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
      </span>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { connected: true, tab: 'day', dayEvery: false, nightEvery: false, armed: false, napRunning: false };
  }
  renderVals() {
    const s = this.state;
    const day = s.tab === 'day';
    const every = day ? s.dayEvery : s.nightEvery;
    const sel = '#CDEFF8';
    let statusTitle, statusDetail, rbClass = 'rb rb-idle', rbLabel, press = () => {};
    if (day) {
      if (s.napRunning) {
        statusTitle = 'Not asleep yet';
        statusDetail = 'Alarm 14:20, nap of 20 min';
        rbClass = 'rb rb-run'; rbLabel = 'Stop nap';
      } else {
        statusTitle = 'No nap alarm';
        statusDetail = 'Last sleep detected: today, 03:12';
        rbLabel = 'Start nap';
      }
      press = () => this.setState({ napRunning: !s.napRunning });
    } else {
      statusDetail = 'Night 22:45 to 08:00, 7 h 30 min';
      if (s.nightEvery) {
        statusTitle = 'Every night';
        rbClass = 'rb rb-off'; rbLabel = 'From 22:45';
      } else if (s.armed) {
        statusTitle = 'Armed for tonight';
        rbClass = 'rb rb-run'; rbLabel = 'Disarm';
        press = () => this.setState({ armed: false });
      } else {
        statusTitle = 'No night alarm';
        rbLabel = 'Arm tonight';
        press = () => this.setState({ armed: true });
      }
    }
    const dark = !day && (s.nightEvery || s.armed);
    const hours = ['12','15','18','21','00','03','06','09','12'].map((label, i) => {
      const f = i / 8;
      const inNight = f > 0.448 && f < 0.833;
      return {
        label,
        top: i === 0 ? '7px' : i === 8 ? 'calc(100% - 7px)' : (f * 100) + '%',
        color: (!day && inNight && !(f > 0.47 && f < 0.80)) ? '#FFFFFF' : '#191C1D',
      };
    });
    return {
      isDay: day, isNight: !day,
      title: day ? 'Day naps' : 'Night sleep',
      statusTitle, statusDetail, rbClass, rbLabel, press,
      cardBg: dark ? '#173A4F' : '#E8F1F4',
      cardFg: dark ? '#E3F4F8' : '#191C1D',
      cardSoft: dark ? '#BCDDE8' : '#40484B',
      onceLabel: day ? 'Next nap' : 'Tonight',
      everyLabel: day ? 'Every nap' : 'Every night',
      onceBg: every ? 'transparent' : sel,
      everyBg: every ? sel : 'transparent',
      modeCaption: day
        ? (every ? 'Starts by itself when you fall asleep, 08:00 to 22:45' : 'Starts when you tap the button')
        : (every ? 'Arms itself every night at 22:45' : 'Arms once, for tonight'),
      setOnce: () => this.setState(day ? { dayEvery: false } : { nightEvery: false }),
      setEvery: () => this.setState(day ? { dayEvery: true, napRunning: false } : { nightEvery: true, armed: false }),
      amount: day ? '20 min' : '7 h 30 min',
      amountPct: day ? '9%' : '82%',
      wake1: day ? 'After 20 min asleep' : 'After 7 h 30 min asleep',
      wake2: day ? '20 min after falling asleep' : '7 h 30 min after falling asleep',
      wake3: day ? '20 min from now' : 'At the night\u2019s end, 08:00',
      extraLabel: day ? 'Napped today' : 'Include today\u2019s naps',
      tlGradient: day
        ? 'linear-gradient(to bottom, #BFE9F3 0%, #BFE9F3 40%, #8FB3C2 49%, #8FB3C2 79%, #BFE9F3 88%, #BFE9F3 100%)'
        : 'linear-gradient(to bottom, #EAF6F9 0%, #EAF6F9 40%, #173A4F 49%, #173A4F 79%, #EAF6F9 88%, #EAF6F9 100%)',
      previewTop: day ? '9.7%' : '48%',
      previewHeight: day ? '1.4%' : '31.2%',
      previewColor: day ? '#1F7A91' : '#9EDDEE',
      hours,
      showDay: (e) => { if (e) e.preventDefault(); this.setState({ tab: 'day' }); },
      showNight: (e) => { if (e) e.preventDefault(); this.setState({ tab: 'night' }); },
      dayPill: day ? sel : 'transparent', nightPill: day ? 'transparent' : sel,
      dayWeight: day ? '700' : '400', nightWeight: day ? '400' : '700',
      connected: s.connected, disconnected: !s.connected,
      chipBg: s.connected ? '#D6F0DC' : '#FFDAD6',
      chipFg: s.connected ? '#1E5631' : '#93000A',
      chipLabel: s.connected ? 'Amazfit Bip, connected' : 'Amazfit Bip, not connected',
      toggleConnected: () => this.setState({ connected: !s.connected }),
    };
  }
}
</script>
</body>
</html>
