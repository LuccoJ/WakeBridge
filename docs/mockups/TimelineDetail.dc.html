<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WakeBridge timeline details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:Roboto,system-ui,sans-serif;color:#191C1D}
a{color:#1F7A91}a:hover{color:#005466}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FBFC; display: flex; flex-direction: column; position: relative">
  <header style="flex: none; padding: 16px 16px 8px 20px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">Night sleep</h1>
  </header>
  <div style="flex: 1; min-height: 0; display: flex; gap: 10px; padding: 4px 20px 8px 10px">
    <aside aria-label="Day and night timeline, 12-hour clock" style="flex: none; width: 34px; position: relative">
      <div style="position: absolute; top: 4px; bottom: 4px; left: 3px; width: 28px">
        <div style="position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(to bottom, #EAF6F9 0%, #EAF6F9 42%, #173A4F 51%, #173A4F 79%, #EAF6F9 88%, #EAF6F9 100%)"></div>
        <div style="position: absolute; top: 50%; height: 31.2%; left: 4px; right: 4px; border-radius: 3px; background: #9EDDEE"></div>
          <span style="position: absolute; top: 9px; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">12<br><span style="font-size: 8.5px; font-weight: 300">PM</span></span>
          <span style="position: absolute; top: 12.5%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">3<br><span style="font-size: 8.5px; font-weight: 300">PM</span></span>
          <span style="position: absolute; top: 25.0%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">6<br><span style="font-size: 8.5px; font-weight: 300">PM</span></span>
          <span style="position: absolute; top: 37.5%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">9<br><span style="font-size: 8.5px; font-weight: 300">PM</span></span>
          <span style="position: absolute; top: 50.0%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">12<br><span style="font-size: 8.5px; font-weight: 300">AM</span></span>
          <span style="position: absolute; top: 62.5%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">3<br><span style="font-size: 8.5px; font-weight: 300">AM</span></span>
          <span style="position: absolute; top: 75.0%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">6<br><span style="font-size: 8.5px; font-weight: 300">AM</span></span>
          <span style="position: absolute; top: 87.5%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">9<br><span style="font-size: 8.5px; font-weight: 300">AM</span></span>
          <span style="position: absolute; top: calc(100% - 9px); left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 11px; line-height: 11px; font-weight: 400; color: #191C1D">12<br><span style="font-size: 8.5px; font-weight: 300">PM</span></span>
        <div style="position: absolute; top: calc(45.8% - 6px); left: -3px; right: -3px; height: 12px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; border: 2px solid #1F7A91; box-shadow: 0 0 0 6px rgba(31, 122, 145, 0.2)"></div>
        <div style="position: absolute; top: calc(83.3% - 6px); left: -3px; right: -3px; height: 12px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; border: 2px solid #1F7A91"></div>
      </div>
      <div style="position: absolute; top: calc(45.8% - 18px); left: 44px; width: max-content; padding: 6px 12px; border-radius: 10px; background: #173A4F; color: #E3F4F8; font-size: 16px; font-weight: 500; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25)">11:00 PM</div>
    </aside>
    <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; opacity: 0.35">
      <section style="height: 76px; border-radius: 20px; background: #173A4F"></section>
      <div style="height: 40px; border-radius: 20px; border: 1px solid #70787B"></div>
      <div style="height: 60px; border-radius: 8px; background: #E1E8EB"></div>
      <div style="height: 130px; border-radius: 8px; background: #E1E8EB"></div>
    </main>
  </div>
  <div role="status" style="position: absolute; left: 24px; right: 24px; bottom: 104px; padding: 12px 16px; border-radius: 12px; background: #2E3132; color: #EFF1F2; font-size: 14px; line-height: 20px">Decrease the sleep amount to shorten the night</div>
  <nav aria-label="Sections" style="flex: none; height: 80px; background: #E8F1F4"></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
